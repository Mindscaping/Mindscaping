<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mindscaping CMS</title>
  <link rel="stylesheet" href="https://unpkg.com/decap-cms@3/dist/decap-cms.css" />
</head>
<body>
  <script>
    // Dynamically set base_url so Decap CMS uses our OAuth endpoint
    // instead of falling back to Netlify's API
    window.CMS_CONFIG = {
      backend: {
        base_url: window.location.origin
      }
    };
  </script>
  <script src="https://unpkg.com/decap-cms@3/dist/decap-cms.js"></script>
</body>
</html>
