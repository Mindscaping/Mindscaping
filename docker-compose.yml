services:
  app:
    build: .
    ports:
      - "3004:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=file:/app/data/prod.db
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - db-data:/app/data
    command: sh -c "npx prisma generate && npx prisma db push --skip-generate && npx next dev --port 3000"

volumes:
  db-data:
