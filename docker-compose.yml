services:
  app:
    build:
      context: .
      args:
        AUTH_SECRET: ${AUTH_SECRET:-build-placeholder}
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=file:/app/data/prod.db
      - NODE_ENV=production
    volumes:
      - db-data:/app/data
    command: sh -c "npx prisma generate && npx prisma db push --skip-generate && node node_modules/.bin/next start"
    restart: unless-stopped

volumes:
  db-data:
